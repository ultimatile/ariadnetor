[package]
name = "ariadnetor-native"
version.workspace = true
edition.workspace = true
description = "Native backend for ariadnetor (faer; strided-perm transpose)"
repository.workspace = true
license.workspace = true
keywords = ["backend", "faer", "tensor", "transpose"]
categories = ["mathematics", "science"]

[lib]
name = "ariadnetor_native"
path = "src/lib.rs"

[dependencies]
ariadnetor-core = { path = "../ariadnetor-core", version = "0.0.7" }
faer = { workspace = true }
hptt = { workspace = true, optional = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }
strided-perm = { workspace = true }
strided-view = { workspace = true }
threadteam = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[features]
# `hptt` is opt-in: the HPTT kernel pulls a C++/CMake build, so the default
# stays pure-Rust. It serves only conjugating complex transposes, which
# strided-perm cannot express; every other transpose uses strided-perm in
# both builds.
default = []
hptt = ["dep:hptt"]

[lints]
workspace = true
