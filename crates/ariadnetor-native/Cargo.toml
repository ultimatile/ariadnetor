[package]
name = "ariadnetor-native"
version.workspace = true
edition.workspace = true
description = "Native backend for ariadnetor (faer; optional HPTT transpose)"
repository.workspace = true
license.workspace = true
keywords = ["backend", "faer", "hptt", "tensor", "transpose"]
categories = ["mathematics", "science"]

[lib]
name = "ariadnetor_native"
path = "src/lib.rs"

[dependencies]
ariadnetor-core = { path = "../ariadnetor-core", version = "0.0.6" }
faer = { workspace = true }
hptt = { workspace = true, optional = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[features]
# `hptt` is opt-in: the HPTT transpose kernel pulls a C++/CMake build, so the
# default stays pure-Rust. Enable it directly or via a dependent crate's `hptt`
# passthrough to use the accelerated kernel.
default = []
hptt = ["dep:hptt"]

[lints]
workspace = true
