[workspace]
resolver = "2"
members = [
  "algorithms-fixtures",
  "crates/ariadnetor",
  "crates/ariadnetor-algorithms",
  "crates/ariadnetor-core",
  "crates/ariadnetor-linalg",
  "crates/ariadnetor-mps",
  "crates/ariadnetor-native",
  "crates/ariadnetor-tensor",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
repository = "https://github.com/ultimatile/ariadnetor"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Linear algebra
faer = "0.24"
hptt = "0.4.1"

# Memory alignment
aligned-vec = "0.6"

# Numeric types
num-complex = "0.4"
num-traits = "0.2"

# Random number generation
rand = "0.10"
rand_distr = "0.6"

# Parallelism
rayon = "1"

# Error handling
thiserror = "2"

ciborium = "0.2"
# Serialization (self-describing metadata via CBOR; numeric bodies are raw LE)
serde = { version = "1", features = ["derive"] }

# Dev dependencies
approx = "0.5"
criterion = { version = "0.8", features = ["html_reports"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
rstest = "0.27"
syn = { version = "3", features = ["full", "visit"] }

[workspace.lints.rust]
dead_code = "forbid"
unreachable_pub = "warn"

[profile.bench]
debug = "line-tables-only"
split-debuginfo = "packed"
